[project]
name = "generativerecs"
version = "0.1.0"
description = "Implementation of Recommender Systems with Generative Retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "mmh3>=5.2.1",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "sentence-transformers>=5.3.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "vector-quantize-pytorch>=1.28.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
